org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official

# IntelliJ Platform 自带与自身版本对齐的 Kotlin stdlib，不要让 Gradle 再打进一份
kotlin.stdlib.default.dependency=false

# JDK 位置是本机相关的，不写进仓库。
# 若 Gradle 找不到 JDK 21，在 ~/.gradle/gradle.properties 里设置：
#   org.gradle.java.installations.paths=/path/to/jdk-25,/path/to/jdk-21
# 或者用 foojay-resolver 让 Gradle 自动下载。

# 发布到 Marketplace 的 token。即使是空值也必须存在，否则 Gradle 配置阶段会报错。
# 实际值通过环境变量 PUBLISH_TOKEN 或 -P 参数传入，不要写在这里。
intellijPlatformPublishingToken=
